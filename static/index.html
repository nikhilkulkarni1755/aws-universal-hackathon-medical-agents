<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SBAR Handoff Team</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#2a2f3a; --text:#e8eaf0; --mute:#8b93a7; --red:#e03131; --amber:#f59f00; --green:#40c057; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.45 system-ui, sans-serif; }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0 auto 0 0; }
  .badge { padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700; border:1px solid var(--line); }
  .syn { background:#5c1a1a; color:#ffc9c9; border-color:var(--red); }
  button { background:#4c6ef5; color:#fff; border:0; border-radius:8px; padding:8px 14px; min-height:38px; font-size:14px; cursor:pointer; touch-action:manipulation; transition:transform .08s, background .15s; }
  button:hover:not(:disabled) { background:#5b7cff; }
  button:active:not(:disabled) { transform:scale(.96); }
  button:disabled { background:#3a3f4c; color:var(--mute); cursor:not-allowed; }
  button:focus-visible, input:focus-visible { outline:2px solid #9db4ff; outline-offset:2px; }
  button.listening { background:var(--red); animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(224,49,49,.6); } 50% { box-shadow:0 0 0 8px rgba(224,49,49,0); } }
  button.busy::after { content:''; display:inline-block; width:12px; height:12px; margin-left:8px; border:2px solid #fff; border-top-color:transparent; border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .askrow { display:flex; gap:6px; margin-top:10px; }
  #status { min-height:1.5em; margin-top:6px; font-size:13px; color:var(--mute); }
  main { display:grid; grid-template-columns:minmax(0,1.5fr) minmax(0,1fr); gap:14px; padding:14px; }
  @media (max-width:900px) { main { grid-template-columns:1fr; } }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px; }
  #stage { display:flex; gap:14px; align-items:center; min-height:230px; }
  #big { width:170px; height:170px; border-radius:50%; display:grid; place-items:center; font-size:64px; font-weight:700; color:#fff; flex:none; border:4px solid transparent; }
  #who { font-size:20px; font-weight:700; } #role { color:var(--mute); }
  #caption { font-size:18px; margin-top:8px; min-height:3.2em; }
  #share { margin-top:8px; } #share img { max-width:260px; border-radius:8px; } #share pre { white-space:pre-wrap; background:#0f1115; padding:8px; border-radius:8px; }
  #strip { display:grid; grid-template-columns:repeat(auto-fill,minmax(92px,1fr)); gap:8px; margin-top:12px; }
  .tile { background:#0f1115; border:2px solid var(--line); border-radius:10px; padding:8px 4px; text-align:center; font-size:12px; }
  .tile .av { width:44px; height:44px; border-radius:50%; margin:0 auto 4px; display:grid; place-items:center; font-weight:700; color:#fff; font-size:20px; }
  .portrait { width:100%; height:100%; border-radius:50%; object-fit:cover; }
  .tile.on { border-color:#fff; box-shadow:0 0 0 2px var(--text); }
  .chip { display:inline-block; background:#232a3b; color:#9db4ff; border-radius:6px; padding:0 6px; margin:0 2px; font-size:12px; white-space:nowrap; }
  #board { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
  .col h3 { margin:0 0 6px; font-size:13px; color:var(--mute); } .bed { border-radius:8px; padding:8px; margin-bottom:6px; font-weight:700; }
  .Escalate { background:#5c1a1a; border:1px solid var(--red); } .Act { background:#4d3a0a; border:1px solid var(--amber); } .Routine { background:#173a22; border:1px solid var(--green); }
  #log { max-height:260px; overflow:auto; font-size:13px; } #log div { padding:3px 0; border-bottom:1px solid var(--line); } #log b { color:#fff; }
  .card { border:1px solid var(--line); border-radius:10px; padding:10px; margin-top:10px; background:#0f1115; }
  .card h4 { margin:0 0 6px; } .iris-ok { color:var(--green); font-weight:700; } .iris-bad { color:var(--red); font-weight:700; }
  .card p { margin:4px 0; } .card .k { color:var(--mute); font-weight:700; margin-right:4px; }
  input[type=text] { flex:1; background:#0f1115; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px; }
</style>
</head>
<body>
<header>
  <h1>SBAR Handoff Team · 4 West</h1>
  <span class="badge syn">SYNTHETIC DATA</span>
  <span class="badge" id="mode">…</span>
  <select id="agent" title="Demo one agent on its own"><option value="">Full handoff</option></select>
  <button id="start">Start</button>
</header>
<main>
  <section>
    <div class="panel">
      <div id="stage">
        <div id="big">?</div>
        <div><div id="who">Huddle ready</div><div id="role">Press Start handoff</div><div id="caption"></div><div id="share"></div></div>
      </div>
      <div id="strip"></div>
    </div>
  </section>
  <section>
    <div class="panel">
      <div id="board"></div>
      <div id="log"></div>
      <div class="askrow">
        <input type="text" id="q" autocomplete="off" placeholder="Type or say your own question (no need to click Start)">
        <button id="mic" aria-label="Speak your question" title="Speak your question">🎤</button>
        <button id="ask">Send</button>
      </div>
      <div id="status" role="status" aria-live="polite"></div>
    </div>
    <div id="cards"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const CHIP = /(\[[^\]]+\])/g;
let personas = {}, tiles = {}, queue = [], busy = false, result = null;
const audioFor = {};   // event id -> Masky audio URL, filled by SSE audio events

function fill(el, text) {              // text with citation chips, built with DOM nodes (no HTML injection)
  el.textContent = '';
  text.split(CHIP).forEach((part) => {
    if (!part) return;
    if (CHIP.test(part)) { const c = document.createElement('span'); c.className = 'chip'; c.textContent = part; el.append(c); }
    else el.append(part);
    CHIP.lastIndex = 0;
  });
}
function avatar(el, name) {            // Masky portrait when the agent has one, else a coloured initial
  const p = personas[name];
  el.textContent = p?.image ? '' : name[0];
  el.style.background = p?.color || '#555';
  const known = ['Quinn', 'Wren', 'Mina', 'Vera', 'Iris'].find((n) => n === name);   // portraits exist for these five only
  if (p?.image && known) { const i = new Image(); i.src = `/assets/portraits/${known}.jpg`; i.alt = known; i.className = 'portrait'; el.append(i); }
}

async function init() {
  const a = await (await fetch('/api/agents')).json();
  $('mode').textContent = a.mode;
  a.demo.forEach((n) => $('agent').append(new Option('Demo: ' + n, n)));
  a.agents.filter((p) => /^[A-Za-z]+$/.test(p.name)).forEach((p) => {   // agent names are plain words
    personas[p.name] = p;
    const t = document.createElement('div'); t.className = 'tile'; tiles[p.name] = t;
    const av = document.createElement('div'), nm = document.createElement('b'), role = document.createElement('div');
    av.className = 'av'; nm.textContent = p.name; role.textContent = p.role; role.style.color = 'var(--mute)';
    t.append(av, nm, role); avatar(av, p.name);
    $('strip').append(t);
  });
  const es = new EventSource('/api/stream');
  es.onmessage = (m) => {
    const e = JSON.parse(m.data);
    if (e.audio_for !== undefined) audioFor[e.audio_for] = e.audio_url;
    else if (e.done) { $('start').disabled = false; $('start').textContent = 'Start'; }
    else { queue.push(e); pump(); }
  };
}

let endCurrent = null;                 // stops the line being spoken right now
const player = new Audio();            // the only audio element, so two voices can never overlap
const SILENCE = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
function unlockAudio() { player.src = SILENCE; player.play().catch(() => {}); }   // a click lets later clips play
const NOVELTY = /albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|kathy|ralph/i;
function fallbackVoice() {
  return speechSynthesis.getVoices().find((v) => /^en/i.test(v.lang) && !NOVELTY.test(v.name)) || null;
}
async function speakText(ev) {         // resolves only when this line has really finished, so the next one never starts early
  const p = personas[ev.from], text = ev.text.replace(CHIP, '');
  for (let i = 0; p?.masky && !audioFor[ev.id] && i < 32; i++) await new Promise((r) => setTimeout(r, 250));
  player.pause(); window.speechSynthesis?.cancel();
  return new Promise((done) => {
    let guard;
    const end = () => { clearTimeout(guard); player.onended = player.onerror = player.onloadedmetadata = null; endCurrent = null; done(); };
    endCurrent = end;
    if (audioFor[ev.id]) {
      guard = setTimeout(end, 40000);  // safety net until the clip's real length is known
      player.onloadedmetadata = () => { clearTimeout(guard); guard = setTimeout(end, player.duration * 1000 + 2000); };
      player.onended = player.onerror = end;
      player.src = audioFor[ev.id]; player.play().catch(end); return;
    }
    if (!window.speechSynthesis || !p) return end();
    guard = setTimeout(end, 3000 + text.length * 120);
    const u = new SpeechSynthesisUtterance(text); u.voice = fallbackVoice(); u.pitch = p.pitch; u.rate = p.rate; u.onend = u.onerror = end;
    speechSynthesis.speak(u);
  });
}

function show(ev) {
  const p = personas[ev.from] || { color: '#555', role: 'Incoming RN' };
  Object.entries(tiles).forEach(([n, t]) => t.classList.toggle('on', n === ev.from));
  avatar($('big'), ev.from); $('big').style.borderColor = '#fff';
  $('who').textContent = `${ev.from} → ${ev.to}`; $('role').textContent = p.role;
  const cap = $('caption'); fill(cap, ev.text + ' ' + ev.citations.join(' '));
  const d = document.createElement('div'); fill(d, `${ev.from} → ${ev.to}: ${ev.text} ${ev.citations.join(' ')}`);
  $('log').append(d); while ($('log').childElementCount > 150) $('log').firstChild.remove(); $('log').scrollTop = 1e9;
  const sh = $('share'); sh.textContent = '';
  const a = ev.attachment;
  if (a?.type === 'svg') {   // sandbox output may be model-written: show it as an image, where scripts cannot run
    const i = new Image(); i.alt = a.title;
    i.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(a.svg.replace(/currentColor/g, '#9db4ff'));
    sh.append(i, ` ${a.title} · ${a.badge}`);
  }
  if (a?.type === 'image') { const i = document.createElement('img'); i.src = a.src; sh.append(i); }
  if (a?.type === 'text') { const pre = document.createElement('pre'); pre.textContent = a.title + ': ' + a.text; sh.append(pre); }
}

async function pump() {
  if (busy) return; busy = true;
  while (queue.length) {
    const ev = queue.shift();
    show(ev);
    if (ev.from === 'Vera' && ev.to === 'Quinn') await refresh();
    await speakText(ev);
    if (ev.to === 'RN' && ev.from === 'Quinn' && ev.text.startsWith('Ready')) await refresh();
  }
  busy = false;
}

async function refresh() {
  for (let i = 0; i < 40 && !result; i++) {
    const s = await (await fetch('/api/state')).json();
    if (s.result) result = s.result; else await new Promise((r) => setTimeout(r, 500));
  }
  if (!result) return;
  const cols = { Escalate: [], 'Act this shift': [], Routine: [] };
  result.ranking.forEach((r) => cols[r.tier].push(r));
  $('board').textContent = '';
  Object.entries(cols).forEach(([tier, rows]) => {
    const c = document.createElement('div'); c.className = 'col'; const h3 = document.createElement('h3'); h3.textContent = tier; c.append(h3);
    rows.forEach((r) => { const b = document.createElement('div'); b.className = 'bed ' + tier.split(' ')[0]; b.textContent = `Bed ${r.bed}`; c.append(b); });
    $('board').append(c);
  });
  renderCards();
}

function renderCards() {
  $('cards').textContent = '';
  result.ranking.forEach((r) => {
    const s = result.sbars[r.bed], f = result.forms[r.bed], card = document.createElement('div'); card.className = 'card';
    const h = document.createElement('h4'); h.textContent = `Bed ${r.bed} · ${r.tier} · `;
    const v = document.createElement('span'); v.className = s.iris.ok ? 'iris-ok' : 'iris-bad'; v.textContent = 'Iris: ' + s.iris.text; h.append(v);
    card.append(h);
    'SBAR'.split('').forEach((k) => { const p = document.createElement('p'); const kk = document.createElement('span'); kk.className = 'k'; kk.textContent = k + ':'; p.append(kk); const t = document.createElement('span'); fill(t, s.sections[k]); p.append(t); card.append(p); });
    const ask = document.createElement('p'); fill(ask, 'Provider form (Quinn) — ask: ' + f.ask); card.append(ask);
    const btn = document.createElement('button'); btn.textContent = 'Approve & send page'; btn.disabled = !s.iris.ok;
    const out = document.createElement('span'); out.style.marginLeft = '8px';
    btn.onclick = async () => {
      btn.disabled = true;
      const res = await fetch('/api/approve/' + r.bed, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ approver: 'Incoming RN', hash: result.hashes[r.bed] }) });
      out.textContent = res.ok ? (await res.json()).status : 'Blocked: ' + (await res.json()).detail;
    };
    card.append(btn, out); $('cards').append(card);
  });
}

$('start').onclick = async () => {
  unlockAudio(); $('start').disabled = true; $('start').textContent = 'Running…';
  result = null; queue = []; $('log').textContent = ''; $('cards').textContent = ''; $('board').textContent = '';
  const r = await fetch('/api/run' + ($('agent').value ? '?agent=' + $('agent').value : ''), { method: 'POST' });
  if (!r.ok) { $('start').disabled = false; $('start').textContent = 'Start'; $('status').textContent = 'A run is already in progress.'; }
};
// The Ask box has one state at a time: idle -> listening -> review -> thinking -> idle.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const ui = { mode: 'idle', rec: null };
const HINT = { idle: '', listening: 'Listening… speak now, then tap ■ Stop', review: 'Check the text, then press Send (or Enter)', thinking: 'The team is working on it…' };
function setMode(mode, note = '') {
  ui.mode = mode;
  const thinking = mode === 'thinking', listening = mode === 'listening';
  $('mic').classList.toggle('listening', listening); $('mic').textContent = listening ? '■ Stop' : '🎤';
  $('mic').disabled = thinking || !SR;
  $('ask').disabled = thinking || listening; $('ask').classList.toggle('busy', thinking); $('ask').textContent = thinking ? 'Thinking' : 'Send';
  $('q').disabled = thinking;
  $('status').textContent = note || HINT[mode];
}
function interrupt() { queue.length = 0; player.pause(); window.speechSynthesis?.cancel(); endCurrent?.(); }   // stop the script so you can speak or be heard

async function ask() {
  if (ui.mode === 'thinking' || ui.mode === 'listening') return;
  const q = $('q').value.trim();
  if (!q) { setMode('idle', 'Type or say a question first'); $('q').focus(); return; }
  unlockAudio(); interrupt(); setMode('thinking');
  try {
    const res = await fetch('/api/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question: q }) });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    $('q').value = ''; setMode('idle');
  } catch (err) {
    setMode('review', `That did not go through (${err.message}). Your text is still here; press Send to retry.`);
  }
  $('q').focus();
}

function toggleMic() {
  if (ui.mode === 'listening') { ui.rec.stop(); return; }
  if (ui.mode === 'thinking') return;
  unlockAudio(); interrupt();
  const r = new SR(); r.lang = 'en-US'; r.interimResults = true; r.continuous = false;
  r.onstart = () => setMode('listening');
  r.onresult = (e) => { $('q').value = Array.from(e.results).map((x) => x[0].transcript).join(' ').trim(); };   // live text; nothing is sent yet
  r.onerror = (e) => setMode('idle', e.error === 'not-allowed' ? 'Microphone blocked: allow it from the address bar' : e.error === 'no-speech' ? 'Did not hear anything. Tap 🎤 and try again' : `Mic problem: ${e.error}`);
  r.onend = () => {
    if (ui.mode !== 'listening') return;   // an error already set the message
    const heard = $('q').value.trim();
    setMode(heard ? 'review' : 'idle', heard ? '' : 'Did not catch that. Tap 🎤 to try again');
    if (heard) $('q').focus();
  };
  ui.rec = r; r.start();
}

$('ask').onclick = ask; $('mic').onclick = toggleMic;
$('q').onkeydown = (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); ask(); } };
setMode('idle', SR ? '' : 'The mic needs Google Chrome. You can still type your question.');
init();
</script>
</body>
</html>
